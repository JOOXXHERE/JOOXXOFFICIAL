<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | JOOXX</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }

        .checkout-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            padding: 60px;
        }

        .checkout-details h1 {
            font-size: 48px;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .checkout-details p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 30px;
        }

        .service-list {
            margin-bottom: 40px;
        }

        .service-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .service-item i {
            color: var(--primary);
        }

        .test-drive {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary);
            text-decoration: underline;
            font-weight: 600;
        }

        .payment-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .qr-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .qr-card img {
            width: 250px;
            height: 250px;
            display: block;
        }

        .price-tag {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .price-tag span {
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .payment-note {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .back-link {
            position: absolute;
            top: 40px;
            left: 40px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 850px) {
            .checkout-container {
                grid-template-columns: 1fr;
                padding: 40px 20px;
            }
            .checkout-page {
                padding: 120px 20px 60px 20px;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

    <main class="checkout-page">
        <div class="checkout-container reveal active" style="text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px;">
            <div class="features-list" style="margin-bottom: 40px; text-align: left; max-width: 400px; width: 100%;">
                <h1 style="font-size: 40px; margin-bottom: 25px; text-align: center;">Live <span>1:1</span> Call</h1>
                <ul style="list-style: none; padding: 0; color: var(--text-muted); font-size: 18px;">
                    <li style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;"><i class="fas fa-video" style="color: var(--primary);"></i> Talk to me live</li>
                    <li style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;"><i class="fas fa-code" style="color: var(--primary);"></i> Turn your ideas to websites</li>
                    <li style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;"><i class="fas fa-lightbulb" style="color: var(--primary);"></i> Get technical advice</li>
                </ul>
            </div>

            <div class="call-box" style="background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 15px; padding: 30px; width: 100%; max-width: 400px; margin-bottom: 30px;">
                <h3 style="font-size: 24px; margin-bottom: 20px;">Register Now</h3>
                <form id="registration-form" action="https://docs.google.com/forms/d/e/1FAIpQLSfHvPKR98Z6UxrvZWNefIS4r5iQWYkeOmm6xeRufBupeS5dvw/formResponse" method="POST">
                    <div class="form-group">
                        <input type="email" id="email" name="entry.2037064031" placeholder="Enter your email address" required 
                               style="width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: white; margin-bottom: 20px;">
                    </div>
                    <input type="hidden" name="fvv" value="1">
                    <input type="hidden" name="pageHistory" value="0">
                    <input type="hidden" name="fbzx" value="4096226219261270335">
                    <button type="submit" class="btn-clean" style="width: 100%; border-radius: 10px; color: black; font-weight: bold;">Book Call</button>
                </form>

                <div id="success-message" style="display: none; margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--primary); border-radius: 10px; color: var(--primary); font-size: 14px; text-align: center;">
                    <i class="fas fa-check-circle" style="margin-bottom: 10px; font-size: 20px;"></i><br>
                    You are registered! You will receive an email shortly with details.
                </div>
            </div>

            <a href="index.html" class="btn-clean">Return to Portfolio</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('registration-form');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            // Show success message immediately as requested
            form.style.display = 'none';
            successMessage.style.display = 'block';

            // Send to Google Forms in background
            try {
                await fetch(form.action, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });
            } catch (err) {
                console.error("Form submission failed, but user saw success message.");
            }
        });
    </script>

    <script src="main.js"></script>
</body>
</html>
